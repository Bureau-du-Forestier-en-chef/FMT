name: R Package Validation (Rtools 4.5)

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

  workflow_dispatch:

jobs:
  r-package:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          rtools-version: "45"
          use-public-rspm: true

      - name: Get R Library Path and R_HOME
        id: r-lib
        shell: Rscript {0}
        run: |
          cat(
            paste0("path=", .libPaths(), "\n"),
            file = Sys.getenv("GITHUB_OUTPUT"),
            append = TRUE
          )
          cat(
            paste0("R_HOME=", normalizePath(R.home(), winslash = "/"), "\n"),
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.r-lib.outputs.path }}
          key: ${{ runner.os }}-r45-${{ hashFiles('**/DESCRIPTION', '.github/workflows/ci-rtools-validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-r45-

      - name: Install Rcpp
        shell: Rscript {0}
        run: |
          if (!requireNamespace("Rcpp", quietly = TRUE)) {
            install.packages(
              "Rcpp",
              repos = "https://r-project.org"
            )
          }

      - name: Verify Rtools Toolchain
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          echo "=== Compiler ==="
          which g++
          g++ --version

          echo "=== Make ==="
          which make
          make --version

      - name: Configure
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"
          export MANPATH="/x86_64-w64-mingw32.static.posix/man:$MANPATH"
          export INFOPATH="/x86_64-w64-mingw32.static.posix/share/info:$INFOPATH"

          if [ -z "$R_HOME" ]; then
              echo "R_HOME is not set" >&2
              exit 1
          fi
          R_DIR_PATH=$(cygpath -m "$R_HOME")

          PYTHON_PATH=$(which python || true)
          if [ -n "$PYTHON_PATH" ]; then
              PYTHON_DIR_PATH=$(cygpath -m "$(dirname "$PYTHON_PATH")")
              PYTHON_ARG="-DPYTHON_DIR=${PYTHON_DIR_PATH}/"
          else
              PYTHON_ARG=""
          fi

          echo "R_DIR=$R_DIR_PATH"
          echo "PYTHON_DIR=$PYTHON_DIR_PATH"

          cmake CMakeLists.txt \
            -B build/ci \
            -G "MSYS Makefiles" \
            ${PYTHON_ARG} \
            -DR_DIR="${R_DIR_PATH}/" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARALLEL_TESTS=4 \
            -DENV_PREFIX="x86_64-w64-mingw32.static.posix" 

      - name: Build
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --build build/ci -j4

      - name: Run Tests
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          ctest --test-dir build/ci --output-on-failure -j4
