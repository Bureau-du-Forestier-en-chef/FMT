name: R Package Validation (Rtools 4.5)

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

  workflow_dispatch:

jobs:
  r-package:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          rtools-version: "45"
          use-public-rspm: true

      - name: Get R Library Path
        id: r-lib
        shell: Rscript {0}
        run: |
          cat(
            paste0("path=", .libPaths()[1], "\n"),
            file = Sys.getenv("GITHUB_OUTPUT"),
            append = TRUE
          )

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.r-lib.outputs.path }}
          key: ${{ runner.os }}-r45-${{ hashFiles('**/DESCRIPTION', '.github/workflows/r-package-validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-r45-

      - name: Install Rcpp
        shell: Rscript {0}
        run: |
          if (!requireNamespace("Rcpp", quietly = TRUE)) {
            install.packages(
              "Rcpp",
              repos = "https://cloud.r-project.org"
            )
          }

      - name: Verify Rtools Toolchain
        shell: C:\rtools45\usr\bin\bash.exe --login -c "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          echo "=== Compiler ==="
          which g++
          g++ --version

          echo "=== Make ==="
          which make
          make --version

          echo "=== Toolchain ==="
          ls -la /x86_64-w64-mingw32.static.posix/bin/g++.exe

      - name: Configure
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -c "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"
          export MANPATH="/x86_64-w64-mingw32.static.posix/man:$MANPATH"
          export INFOPATH="/x86_64-w64-mingw32.static.posix/share/info:$INFOPATH"

          R_DIR_PATH=$(cygpath -m "$R_HOME")

          PYTHON_PATH=$(which python || true)

          if [ -n "$PYTHON_PATH" ]; then
              PYTHON_DIR_PATH=$(cygpath -m "$(dirname "$PYTHON_PATH")")
              PYTHON_ARG="-DPYTHON_DIR=${PYTHON_DIR_PATH}/"
          else
              PYTHON_ARG=""
          fi

          echo "R_DIR=$R_DIR_PATH"
          echo "PYTHON_DIR=$PYTHON_DIR_PATH"

          cmake CMakeLists.txt \
            -B build/release \
            -G "MSYS Makefiles" \
            ${PYTHON_ARG} \
            -DR_DIR="${R_DIR_PATH}/" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARALLEL_TESTS=4 \
            -DENV_PREFIX="x86_64-w64-mingw32.static.posix" \
            -DGENERATE_RELEASE_PACKAGE=true \
            -DWITHOUT_TESTS=true

      - name: Build
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -c "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --build build/release -j4

      - name: Install
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -c "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --install build/release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FMT-Rtools45
          path: |
            build/release/bin/Release/*.zip
            build/release/bin/Release/*.tar.gz
          if-no-files-found: warn