name: R Package Validation (Rtools 4.5)

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rtools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-package:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          rtools-version: "45"
          use-public-rspm: true

      - name: Get R Library Path and R_HOME
        id: r-lib
        shell: Rscript {0}
        run: |
          lib_path <- normalizePath(.Library, winslash = "/")
          r_home <- normalizePath(R.home(), winslash = "/")
          r_dir <- paste0(r_home, "/")
          cat(
            paste0("path=", lib_path, "\n"),
            sep = "",
            file = Sys.getenv("GITHUB_OUTPUT"),
            append = TRUE
          )
          cat(
            paste0("R_HOME=", r_home, "\n"),
            paste0("R_DIR=", r_dir, "\n"),
            sep = "",
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.r-lib.outputs.path }}
          key: ${{ runner.os }}-r45-${{ hashFiles('**/DESCRIPTION', '.github/workflows/ci-rtools-validation.yml') }}
          restore-keys: |
            ${{ runner.os }}-r45-

      - name: Install Rcpp
        shell: Rscript {0}
        run: |
          if (!requireNamespace("Rcpp", lib.loc = .Library, quietly = TRUE)) {
            install.packages(
              "Rcpp",
              lib = .Library,
              repos = "https://cloud.r-project.org"
            )
          }
          stopifnot(file.exists(file.path(.Library, "Rcpp", "include", "Rcpp.h")))

      - name: Verify Rtools Toolchain
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          echo "=== Compiler ==="
          which g++
          g++ --version

          echo "=== Make ==="
          which make
          make --version

      - name: Link ENV_PREFIX to Rtools45
        shell: cmd
        run: |
          if not exist "..\..\x86_64-w64-mingw32.static.posix" (
            mklink /J "..\..\x86_64-w64-mingw32.static.posix" "C:\rtools45\x86_64-w64-mingw32.static.posix"
          )

      - name: Configure
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
          R_LIBS_USER: ${{ steps.r-lib.outputs.path }}
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"
          export MANPATH="/x86_64-w64-mingw32.static.posix/man:$MANPATH"
          export INFOPATH="/x86_64-w64-mingw32.static.posix/share/info:$INFOPATH"

          if [ -z "$R_HOME" ]; then
              echo "R_HOME is not set" >&2
              exit 1
          fi
          R_DIR_PATH=$(cygpath -m "$R_HOME")
          PYTHON_DIR_PATH=$(cygpath -m "$pythonLocation")

          echo "R_DIR=$R_DIR_PATH"
          echo "PYTHON_DIR=$PYTHON_DIR_PATH"

          cmake CMakeLists.txt \
            -B build/ci \
            -G "MSYS Makefiles" \
            -DPYTHON_DIR="${PYTHON_DIR_PATH}/" \
            -DR_DIR="${R_DIR_PATH}/" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARALLEL_TESTS=4 \
            -DENV_PREFIX="x86_64-w64-mingw32.static.posix" \
            -DGENERATE_RELEASE_PACKAGE=false \
            -DWITHOUT_TESTS=false

      - name: Build
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --build build/ci --config Release -j 4

      # The CMake install step runs the test suite (INSTALL_TEST_SUITE), so
      # this step is the test step: it must fail when a test fails.
      - name: Install and Run Tests
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
          R_LIBS_USER: ${{ steps.r-lib.outputs.path }}
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --install build/ci --config Release -j 4

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-rtools
          path: build/ci/Testing
          if-no-files-found: ignore
          retention-days: 14
