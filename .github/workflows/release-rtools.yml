name: Release Rtools

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  rtools-release:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          rtools-version: "45"
          use-public-rspm: true

      - name: Get R Library Path and R_HOME
        id: r-lib
        shell: Rscript {0}
        run: |
          lib_path <- normalizePath(.Library, winslash = "/")
          r_dir <- paste0(normalizePath(R.home(), winslash = "/"), "/")
          cat(
            paste0("path=", lib_path, "\n"),
            file = Sys.getenv("GITHUB_OUTPUT"),
            append = TRUE
          )
          cat(
            paste0("R_HOME=", normalizePath(R.home(), winslash = "/"), "\n"),
            paste0("R_DIR=", r_dir, "\n"),
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )

      - name: Install Rcpp
        shell: Rscript {0}
        run: |
          if (!requireNamespace("Rcpp", lib.loc = .Library, quietly = TRUE)) {
            install.packages(
              "Rcpp",
              lib = .Library,
              repos = "https://r-project.org"
            )
          }

      - name: Configure
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
          R_LIBS_USER: ${{ steps.r-lib.outputs.path }}
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"
          export MANPATH="/x86_64-w64-mingw32.static.posix/man:$MANPATH"
          export INFOPATH="/x86_64-w64-mingw32.static.posix/share/info:$INFOPATH"

          if [ -z "$R_HOME" ]; then
              echo "R_HOME is not set" >&2
              exit 1
          fi
          R_DIR_PATH=$(cygpath -m "$R_HOME")
          PYTHON_DIR_PATH=$(cygpath -m "$pythonLocation")

          echo "R_DIR=$R_DIR_PATH"
          echo "PYTHON_DIR=$PYTHON_DIR_PATH"

          cmake CMakeLists.txt \
            -B build/release \
            -G "MSYS Makefiles" \
            -DPYTHON_DIR="${PYTHON_DIR_PATH}/" \
            -DR_DIR="${R_DIR_PATH}/" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENV_PREFIX="x86_64-w64-mingw32.static.posix" \
            -DGENERATE_RELEASE_PACKAGE=true \
            -DWITHOUT_TESTS=true

      - name: Build
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --build build/release --config Release -j4

      - name: Install
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail "{0}"
        run: |
          export MINGW_MOUNT_POINT="/x86_64-w64-mingw32.static.posix"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:/usr/local/bin:/usr/bin:$PATH"

          cmake --install build/release --config Release

      - name: Upload GNU Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            build/release/**/FMT-Release-*.7z
            build/release/**/FMT_*.tar.gz
