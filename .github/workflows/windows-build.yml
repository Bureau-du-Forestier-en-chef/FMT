name: Windows Build

on:
  push:
    branches:
      - master
      - dev

  workflow_dispatch:

jobs:
  build:
    needs: clang-tidy
    runs-on: windows-2022

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**', 'vcpkg-custom-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: cmd
        run: |
          set RETRIES=5

          :retry

          cmake CMakeLists.txt ^
            -B build/release ^
            -G "Visual Studio 17 2022" ^
            -DBUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_MANIFEST_MODE=ON ^
            -DVCPKG_MANIFEST_FEATURES="" ^
            -DWITHOUT_TESTS=true ^
            -DVCPKG_MANIFEST_FEATURES=onnx ^
            -DGENERATE_RELEASE_PACKAGE=true

          if %ERRORLEVEL% EQU 0 exit /b 0

          set /a RETRIES-=1

          if %RETRIES% LEQ 0 exit /b 1

          echo Configure failed, retrying in 60 seconds...
          timeout /t 60

          goto retry

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Install
        run: cmake --install build/release --config Release

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**', 'vcpkg-custom-ports/**') }}